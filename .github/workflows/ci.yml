name: Reproducible Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: TypeScript, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2

      - name: Install pinned npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: SDK and evidence tests
        run: npm test

      - name: Filing tests
        run: npm run test:filing

      - name: Verify JavaScript dependency pins
        run: npm ls genlayer genlayer-js --depth=0

      - name: Require a clean production dependency audit
        run: npm audit --omit=dev

      - name: Reject high or critical findings in the complete dependency tree
        run: npm audit --audit-level=high

      - name: Build outside the repository tree
        run: |
          build_dir="$(mktemp -d)"
          trap 'rm -rf -- "$build_dir"' EXIT
          npm run build -- --outDir "$build_dir"
          test -s "$build_dir/index.html"

  python:
    name: Direct, integration, and GenVM checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GENVM_REPO: genlayerlabs/genvm
      GENVM_VERSION: v0.3.0-rc7
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.3

      - name: Install pinned Python and GenLayer tooling
        run: python -m pip install --disable-pip-version-check --constraint constraints.txt -r requirements.txt

      - name: Verify Python dependency pins
        run: python scripts/check_dependency_pins.py --installed

      - name: Official direct contract tests
        run: PYTHONPATH=. python -m pytest tests/direct -v

      - name: Read-only Studio integration tests
        run: PYTHONPATH=. python -m pytest tests/integration -v -m integration -rs

      - name: GenVM lint
        run: python -m genvm_linter.cli check contracts/LegxusDisputeResolution.py

      - name: GenVM schema extraction
        run: python -m genvm_linter.cli schema contracts/LegxusDisputeResolution.py

      - name: GenVM strict typecheck
        run: python -m genvm_linter.cli typecheck contracts/LegxusDisputeResolution.py --strict

      - name: Remove generated Python output
        if: always()
        run: |
          rm -rf -- artifacts .pytest_cache
          find contracts tests config -type d -name __pycache__ -prune -exec rm -rf -- {} +

      - name: Repository hygiene and diff checks
        if: always()
        run: |
          bash scripts/check_repository_hygiene.sh
          git diff --check
          test ! -e artifacts
          test ! -e contracts/__pycache__
          test ! -e .pytest_cache
